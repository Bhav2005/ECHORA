# Render Blueprint configuration for Echora
# Deploy all services and databases automatically on Render.com

services:
  # 1. Identity Microservice
  - type: web
    name: echora-identity-service
    runtime: node
    rootDir: identity-service
    buildCommand: npm install
    startCommand: node src/server.js
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: echora-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX
        value: 5
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: 587
      - key: EMAIL_USER
        value: bhavanac1905@gmail.com
      - key: EMAIL_PASS
        value: apwr yvzu bqhj pwxg

  # 2. Complaint Microservice
  - type: web
    name: echora-complaint-service
    runtime: node
    rootDir: complaint-service
    buildCommand: npm install
    startCommand: node src/server.js
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: echora-db
          property: connectionString
      - key: IDENTITY_SERVICE_URL
        fromService:
          type: web
          name: echora-identity-service
          property: host
      - key: JWT_SECRET
        generateValue: true

  # 3. Frontend Web Application (Static Site)
  - type: web
    name: echora-ui
    runtime: static
    rootDir: frontend
    staticPublishPath: .

databases:
  # Shared PostgreSQL Database for Render Free Tier
  - name: echora-db
    databaseName: echora_db
    plan: free
